[project]
name = "audio-organizer"
version = "0.1.0"
description = "Maintain a music collection: catalog, metadata, duplicates, playlists and S3 sync"
readme = "README.md"
authors = [
    { name = "Samuel Rinnetmäki", email = "info@ctrldash.app" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.108",
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "mutagen>=1.48.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
aorg = "audio_organizer.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "moto[s3]>=5.2.3",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
