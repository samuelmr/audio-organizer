[project]
name = "audio-organizer"
version = "0.1.0"
description = "Maintain a music collection: catalog, metadata, duplicates, playlists and S3 sync"
readme = "README.md"
authors = [
    { name = "Samuel Rinnetmäki", email = "samuel@iki.fi" }
]
requires-python = ">=3.13"
dependencies = [
    "mutagen>=1.48.1",
    "sqlalchemy>=2",
    "typer>=0.27.2",
]

[project.scripts]
aorg = "audio_organizer.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
